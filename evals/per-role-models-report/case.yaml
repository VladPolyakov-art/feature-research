schema_version: "1.1"
name: per-role-models-report
expected_outcome: |
  The agent reads README.md, research/personas.md, research/competitive-analysis.md and docs/user-feedback.md, shows a short plan, reuses the existing competitive analysis (summarizes and links it, keeps its tags and re-cites its sources, researches only what it does not cover), researches how 3-6 tools that run AI agents or coding assistants let users pick a model per task or role (each with a link), and writes research/feature-<slug>.md with all six sections: problem and job (citing the feedback file as evidence and marking the rest as assumptions), how others solve it, users (reusing the two existing personas instead of inventing new ones), 2-3 options from a smallest viable shape to a full one with S/M/L effort marked as an estimate, a recommendation with MoSCoW, an MVP slice, success metrics with a measurement method and no invented baselines or targets, and a Sources list. The file starts with the kit header block (Skill, Date, Product, Inputs naming the sibling files it reused, Tags), uses the shared tags ([source: Sn], [assumption], [estimate], [user: file]) and ends with Sources and a tag legend; a row is added to research/INDEX.md. Any simulated interview snippets are labelled synthetic. It ends with a chat summary of at most about 8 lines, including at most one next-step line suggesting a sibling skill.
context:
  scaffold_script: place-files.sh
